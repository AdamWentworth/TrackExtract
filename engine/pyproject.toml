[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trackextract-engine"
version = "0.1.0"
description = "Python engine for TrackExtract local stem separation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Phlosion" }]
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
trackextract-engine = "trackextract_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trackextract_engine*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
