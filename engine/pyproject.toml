[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trackextract-engine"
version = "0.1.0"
description = "Python engine for Track Extract local stem separation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Track Extract contributors" }]
license = "MIT"
keywords = ["audio", "source-separation", "stem-separation", "demucs", "audio-separator"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.8"]
runtime-cpu = [
  "static-ffmpeg",
  "demucs==4.0.1",
  "audio-separator[cpu]==0.44.1",
]
runtime-gpu = [
  "static-ffmpeg",
  "demucs==4.0.1",
  "audio-separator[gpu]==0.44.1",
]
runtime-dml = [
  "static-ffmpeg",
  "demucs==4.0.1",
  "audio-separator[dml]==0.44.1",
]

[project.scripts]
trackextract-engine = "trackextract_engine.cli:main"

[tool.setuptools]
packages = [
  "trackextract_engine",
  "trackextract_engine.providers",
  "trackextract_engine.workers",
]
package-dir = { "trackextract_engine" = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
