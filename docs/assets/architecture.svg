<svg width="1120" height="420" viewBox="0 0 1120 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Track Extract architecture</title>
  <desc id="desc">React TypeScript UI talks to a thin Rust Tauri bridge, which launches the Python engine for projects, jobs, model management, providers, and audio outputs.</desc>
  <rect width="1120" height="420" rx="24" fill="#0B1016"/>
  <rect x="1" y="1" width="1118" height="418" rx="23" stroke="#1F2A36" stroke-width="2"/>

  <text x="48" y="58" fill="#F5F7FA" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="700">Track Extract Runtime Shape</text>
  <text x="48" y="88" fill="#9BA8B6" font-family="Inter, Segoe UI, sans-serif" font-size="15">A desktop-first app with a web UI, thin native shell, and Python-owned ML workflow engine.</text>

  <defs>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#121B24"/>
      <stop offset="1" stop-color="#0E151D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2EC4D6"/>
      <stop offset="1" stop-color="#F7C948"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#5E7187" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="48" y="128" width="220" height="152" rx="16" fill="url(#card)" stroke="#263445"/>
    <rect x="68" y="148" width="42" height="42" rx="12" fill="#102D35" stroke="#245F6C"/>
    <path d="M82 170C90 156 100 156 108 170C100 184 90 184 82 170Z" stroke="#2EC4D6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="216" fill="#F5F7FA" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">React UI</text>
    <text x="68" y="244" fill="#9BA8B6" font-family="Inter, Segoe UI, sans-serif" font-size="14">Workspace, model library,</text>
    <text x="68" y="265" fill="#9BA8B6" font-family="Inter, Segoe UI, sans-serif" font-size="14">jobs, preview, export.</text>
  </g>

  <line x1="282" y1="204" x2="356" y2="204" stroke="#5E7187" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="370" y="128" width="220" height="152" rx="16" fill="url(#card)" stroke="#263445"/>
    <rect x="390" y="148" width="42" height="42" rx="12" fill="#231D10" stroke="#775C13"/>
    <path d="M404 162H418V176H404V162ZM410 156V182M398 168H424" stroke="#F7C948" stroke-width="3" stroke-linecap="round"/>
    <text x="390" y="216" fill="#F5F7FA" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">Rust Tauri Bridge</text>
    <text x="390" y="244" fill="#9BA8B6" font-family="Inter, Segoe UI, sans-serif" font-size="14">Desktop shell, commands,</text>
    <text x="390" y="265" fill="#9BA8B6" font-family="Inter, Segoe UI, sans-serif" font-size="14">events, paths, media URLs.</text>
  </g>

  <line x1="604" y1="204" x2="678" y2="204" stroke="#5E7187" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="692" y="128" width="380" height="152" rx="16" fill="url(#card)" stroke="#263445"/>
    <rect x="712" y="148" width="42" height="42" rx="12" fill="#18251C" stroke="#376946"/>
    <path d="M724 170H742M733 160V180M724 160C724 155 742 155 742 160V180C742 185 724 185 724 180V160Z" stroke="#73D18B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="712" y="216" fill="#F5F7FA" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">Python Engine</text>
    <text x="712" y="244" fill="#9BA8B6" font-family="Inter, Segoe UI, sans-serif" font-size="14">Projects, sessions, workflows, jobs,</text>
    <text x="712" y="265" fill="#9BA8B6" font-family="Inter, Segoe UI, sans-serif" font-size="14">model installs, Demucs, audio-separator, stub.</text>
  </g>

  <g>
    <rect x="132" y="326" width="856" height="44" rx="12" fill="#0E151D" stroke="#263445"/>
    <rect x="151" y="342" width="160" height="12" rx="6" fill="url(#accent)"/>
    <text x="337" y="353" fill="#D9E2EC" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="600">Output folders:</text>
    <text x="451" y="353" fill="#9BA8B6" font-family="Inter, Segoe UI, sans-serif" font-size="14">original, stems, renders, logs, session.json</text>
  </g>
</svg>
